<section class="card h-100 pokemon-card">
  <img [src]="pokemon.image" [alt]="pokemon.name" class="card-img-top">
  <div class="card-body text-center">
    <h3 class="card-title h5 text-capitalize">{{ pokemon.name }}</h3>
    <p class="card-text text-body-secondary">Pokédex #{{ pokemon.id }}</p>
    <div class="d-grid gap-2">
      <a class="btn btn-primary" [routerLink]="['/card', pokemon.id]">Ver detalle</a>
      <button class="btn btn-outline-primary" type="button" disabled title="Disponible próximamente">
        Comprar
      </button>
      <button class="btn btn-outline-secondary" type="button" disabled title="Disponible próximamente">
        Agregar al carrito
      </button>
    </div>
  </div>
</section>
