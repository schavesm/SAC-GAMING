<section class="card h-100">
  <img [src]="game.img" [alt]="game.title" class="card-img-top">
  <div class="card-body">
    <h4 class="card-title">{{ game.title }}</h4>
    <p class="card-text">{{ game.text }}</p>
    <p class="card-text"><small class="text-body-secondary">{{ game.platform }} · {{ game.genre }}</small></p>
    <p class="card-text fw-bold">{{ game.price | currency:'COP':'symbol-narrow':'1.0-0':'es-CO' }}</p>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-primary" type="button">
        Guardar
      </button>
      <button class="btn btn-primary" type="button">
        Agregar al carrito
      </button>
    </div>
  </div>
</section>
