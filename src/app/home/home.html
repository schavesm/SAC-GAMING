<app-carousel></app-carousel>

<section class="mt-5" id="pokemones">
  <h2>Pokémon</h2>
  @if (loadingPokemons()) {
    <p>Cargando Pokémon...</p>
  } @else if (pokemonError()) {
    <p role="alert">No se pudieron cargar los Pokémon. Inténtalo de nuevo más tarde.</p>
  } @else {
    <div class="row g-4">
      @for (pokemon of pokemons(); track pokemon.id) {
        <div class="col-6 col-md-4 col-lg-3 col-xl-2">
          <app-card [pokemon]="pokemon"></app-card>
        </div>
      }
    </div>
  }
</section>
