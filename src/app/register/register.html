<section class="auth-layout row justify-content-center align-items-center py-4 py-lg-5" aria-labelledby="register-title">
  <div class="col-12 col-md-9 col-lg-7 col-xl-6">
    <div class="card bg-dark text-light border-secondary shadow-lg p-4 p-md-5">
      <h1 class="h2 fw-bold text-center mb-2" id="register-title">Crear cuenta</h1>
      <p class="text-body-secondary text-center mb-4">Guarda y compra en segundos</p>

      <form (submit)="$event.preventDefault()">
        <div class="row g-3">
          <div class="col-6">
            <label class="form-label fw-semibold" for="register-first-name">Nombre</label>
            <input
              class="form-control"
              id="register-first-name"
              name="firstName"
              type="text"
              autocomplete="given-name"
              placeholder="Tu nombre"
              required
            />
          </div>

          <div class="col-6">
            <label class="form-label fw-semibold" for="register-last-name">Apellido</label>
            <input
              class="form-control"
              id="register-last-name"
              name="lastName"
              type="text"
              autocomplete="family-name"
              placeholder="Tu apellido"
              required
            />
          </div>
        </div>

        <div class="mt-3 mb-3">
          <label class="form-label fw-semibold" for="register-email">Correo electrónico</label>
          <input
            class="form-control"
            id="register-email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="tucorreo@ejemplo.com"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold" for="register-password">Contraseña</label>
          <input
            class="form-control"
            id="register-password"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="Crea una contraseña"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold" for="register-confirm-password">Confirmar contraseña</label>
          <input
            class="form-control"
            id="register-confirm-password"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Repite tu contraseña"
            required
          />
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" id="register-terms" name="terms" type="checkbox" required />
          <label class="form-check-label text-body-secondary" for="register-terms">
            Acepto los <a class="link-primary link-underline-opacity-0 link-underline-opacity-100-hover" href="#terminos-y-condiciones">términos y condiciones</a>
          </label>
        </div>

        <button class="btn btn-primary w-100 py-2" type="submit">Crear cuenta</button>
      </form>

      <p class="text-body-secondary mt-4 mb-0">
        ¿Ya tienes cuenta?
        <a class="link-primary link-underline-opacity-0 link-underline-opacity-100-hover" routerLink="/login">Inicia sesión</a>
      </p>
    </div>
  </div>
</section>
